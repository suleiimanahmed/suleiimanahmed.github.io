<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Borehole heat exchangers beneath a campus with an exploratory drilling rig"><defs><linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a98f70"/><stop offset="1" stop-color="#3b4350"/></linearGradient><linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2a47"/><stop offset="1" stop-color="#4d9ac2"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffc266"/></marker><marker id="ab" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>text{font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:15px;font-weight:600;fill:#eaf2f8}.t2{font-size:12px;font-weight:500;fill:#bcd0de}.am{fill:none;stroke:#ffc266;stroke-width:3.5;stroke-linecap:round}.ab{fill:none;stroke:#7dd3fc;stroke-width:3.5;stroke-linecap:round}
.up path{animation:up 2.6s ease-in-out infinite}.up path:nth-child(2){animation-delay:.5s}.up path:nth-child(3){animation-delay:1s}.up path:nth-child(4){animation-delay:1.5s}
.dn path{animation:dn 2.6s ease-in-out infinite}.dn path:nth-child(2){animation-delay:.6s}.dn path:nth-child(3){animation-delay:1.2s}
.flow{stroke-dasharray:3 9;animation:fl 1.6s linear infinite}.wave{stroke-dasharray:22 12;animation:fl 1.1s linear infinite}
.sun{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}.drill{animation:drill 3s ease-in-out infinite}.shake{animation:shake .5s linear infinite}
@keyframes up{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
@keyframes dn{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes fl{to{stroke-dashoffset:-48}}@keyframes pulse{50%{transform:scale(1.14);opacity:.8}}@keyframes drill{50%{transform:translateY(10px)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></defs><rect width="800" height="500" fill="#0c1a28"/><rect width="800" height="170" fill="url(#g2)"/><rect y="170" width="800" height="330" fill="url(#g1)"/><path d="M0 170H800" stroke="#6ee7a8" stroke-width="5"/><g fill="#26384d"><rect x="60" y="92" width="120" height="78"/><rect x="190" y="60" width="90" height="110"/><rect x="290" y="104" width="100" height="66"/></g><g fill="#fff1c2" opacity=".9"><rect x="76" y="108" width="20" height="14"/><rect x="110" y="108" width="20" height="14"/><rect x="144" y="108" width="20" height="14"/><rect x="206" y="80" width="18" height="14"/><rect x="240" y="80" width="18" height="14"/></g><g fill="none" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M110 170V380Q110 405 130 405T150 380V170" stroke="#e8e2d6" opacity=".55"/><path d="M215 170V400Q215 425 235 425T255 400V170" stroke="#e8e2d6" opacity=".55"/><path d="M320 170V380Q320 405 340 405T360 380V170" stroke="#e8e2d6" opacity=".55"/></g><g class="am up"><path d="M150 360V250" marker-end="url(#ah)"/><path d="M255 380V270" marker-end="url(#ah)"/><path d="M360 360V250" marker-end="url(#ah)"/></g><g class="ab dn"><path d="M110 230V340" marker-end="url(#ab)"/><path d="M215 250V360" marker-end="url(#ab)"/><path d="M320 230V340" marker-end="url(#ab)"/></g><g transform="translate(560 40)"><rect y="40" width="70" height="90" fill="#3b4c60"/><rect x="60" width="10" height="130" fill="#5a6b80"/><g class="drill"><path d="M65 130V320" stroke="#dbe3ea" stroke-width="6"/><path d="M50 320h30l-15 22z" fill="#dbe3ea"/></g></g><text x="24" y="460">Borehole heat exchangers</text><text x="24" y="480" class="t2">warm flow up, cool flow down</text><text x="560" y="205" class="t2">Exploratory drilling and sampling</text></svg>