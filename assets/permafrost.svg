<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Pile-supported structure over thawing permafrost with active layer, thaw boundary and heat flux"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2a47"/><stop offset="1" stop-color="#4d9ac2"/></linearGradient><linearGradient id="al" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a6f55"/><stop offset="1" stop-color="#5f4d3e"/></linearGradient><linearGradient id="pf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3f78a3"/><stop offset="1" stop-color="#143452"/></linearGradient><marker id="ah" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#ffc266"/></marker><marker id="ab" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7dd3fc"/></marker><style>text{font-family:system-ui,Segoe UI,Arial,sans-serif;font-size:15px;font-weight:600;fill:#eaf2f8}.t2{font-size:12px;font-weight:500;fill:#bcd0de}.am{fill:none;stroke:#ffc266;stroke-width:3.5;stroke-linecap:round}.ab{fill:none;stroke:#7dd3fc;stroke-width:3.5;stroke-linecap:round}
.up path{animation:up 2.6s ease-in-out infinite}.up path:nth-child(2){animation-delay:.5s}.up path:nth-child(3){animation-delay:1s}.up path:nth-child(4){animation-delay:1.5s}
.dn path{animation:dn 2.6s ease-in-out infinite}.dn path:nth-child(2){animation-delay:.6s}.dn path:nth-child(3){animation-delay:1.2s}
.flow{stroke-dasharray:3 9;animation:fl 1.6s linear infinite}.wave{stroke-dasharray:22 12;animation:fl 1.1s linear infinite}
.sun{transform-box:fill-box;transform-origin:center;animation:pulse 4s ease-in-out infinite}.drill{animation:drill 3s ease-in-out infinite}.shake{animation:shake .5s linear infinite}
@keyframes up{0%{transform:translateY(8px);opacity:0}30%{opacity:1}100%{transform:translateY(-10px);opacity:0}}
@keyframes dn{0%{transform:translateY(-8px);opacity:0}30%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@keyframes fl{to{stroke-dashoffset:-48}}@keyframes pulse{50%{transform:scale(1.14);opacity:.8}}@keyframes drill{50%{transform:translateY(10px)}}@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.2px)}75%{transform:translateX(1.2px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; }
}
</style></defs><rect width="800" height="500" fill="#0c1a28"/><rect width="800" height="190" fill="url(#sk)"/><circle class="sun" cx="660" cy="120" r="40" fill="#ffeab0" opacity=".95"/><path d="M0 190C200 178 360 200 520 188S720 180 800 192V300H0Z" fill="url(#al)"/><path d="M0 300C180 322 330 280 500 306S700 320 800 296V500H0Z" fill="url(#pf)"/><g stroke="#bfe6fb" stroke-width="2" opacity=".5"><path d="M60 380h90M200 420h120M420 390h110M600 430h130M120 450h80M640 365h90"/></g><path class="flow" d="M0 300C180 322 330 280 500 306S700 320 800 296" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/><g fill="#d3dbe2"><rect x="278" y="150" width="12" height="190" rx="3"/><rect x="394" y="150" width="12" height="200" rx="3"/><rect x="510" y="150" width="12" height="205" rx="3"/></g><rect x="250" y="96" width="300" height="46" rx="4" fill="#26384d"/><rect x="236" y="86" width="328" height="14" rx="3" fill="#5eead4"/><rect x="266" y="108" width="26" height="20" rx="2" fill="#fff1c2" opacity=".9"/><rect x="333" y="108" width="26" height="20" rx="2" fill="#fff1c2" opacity=".9"/><rect x="400" y="108" width="26" height="20" rx="2" fill="#fff1c2" opacity=".9"/><rect x="467" y="108" width="26" height="20" rx="2" fill="#fff1c2" opacity=".9"/><g class="am up"><path d="M110 288V222" marker-end="url(#ah)"/><path d="M165 292V226" marker-end="url(#ah)"/><path d="M660 288V222" marker-end="url(#ah)"/><path d="M715 290V224" marker-end="url(#ah)"/></g><text x="24" y="205">Active layer</text><text x="24" y="320" style="fill:#5eead4">Thaw boundary</text><text x="24" y="440">Permafrost</text><text x="24" y="460" class="t2">frozen ground, ice-rich lenses</text><text x="640" y="262" class="t2">Heat flux</text></svg>